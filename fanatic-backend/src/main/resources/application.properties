# ========== SERVER ==========
server.port=${PORT:8080}
spring.application.name=fanatic-backend

# ========== SUPABASE DATABASE ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========== FILE UPLOAD ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ========== STRIPE ==========
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_replace}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_replace}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_replace}
stripe.success-url=${STRIPE_SUCCESS_URL:https://fanatic-seven.vercel.app/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:https://fanatic-seven.vercel.app/payment/cancel}

# ========== APP CONFIG ==========
fanatic.points.per-add=10
fanatic.points.per-review=25
fanatic.points.per-early-review=50
fanatic.verified.follower-threshold=100

# ========== CORS ==========
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://fanatic-seven.vercel.app,http://localhost:5173,http://localhost:3000}

# ========== LOGGING ==========
logging.level.com.fanatic=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ========== SWAGGER ==========
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method